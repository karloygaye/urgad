# Appliquer ce Blueprint dans Render : New → Blueprint → repo GitHub karloygaye/urgad
# Ça crée le Postgres Francfort et branche DATABASE_URL tout seul.
services:
  - type: web
    name: urgad-api
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci
    startCommand: npx tsx src/index.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PREVIEW_DIR
        value: /opt/render/project/src/public
      - key: URGAD_SEED
        value: "0"
      - key: URGAD_EXPOSE_CODES
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: urgad-db
          property: connectionString
      - key: URGAD_ADMIN_EMAIL
        sync: false
      - key: URGAD_ADMIN_PASSWORD
        sync: false

databases:
  - name: urgad-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: 16
    ipAllowList: []
