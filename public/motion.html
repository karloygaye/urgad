<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URGAD — Film</title>
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/playfair-display@latest/latin-700-italic.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/playfair-display@latest/latin-700-normal.css">
<style>
:root{--bg:#07090f;--ink:#F4EFE4;--mute:#9AA3B5;--gold:#D4AF37;--gold2:#F3D58A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
body{cursor:none}
.stage{position:relative;width:100%;height:100%;overflow:hidden;background:#07090f}
canvas#fx{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;z-index:2;padding:6vh 6vw;text-align:center;pointer-events:none;transition:opacity .7s ease}
.scene.on{opacity:1}
.caption{
  position:absolute;left:50%;bottom:7vh;transform:translateX(-50%);
  z-index:5;max-width:28ch;font-family:"Playfair Display",serif;font-size:clamp(20px,3vw,38px);
  font-weight:700;letter-spacing:-.03em;line-height:1.15;text-align:center;
  text-shadow:0 12px 40px rgba(0,0,0,.65);
}
.caption small{display:block;margin-top:10px;font-family:Inter,sans-serif;font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold2);font-weight:600}
.logo3d{width:min(28vw,220px);filter:drop-shadow(0 28px 50px rgba(212,175,55,.35));transform:perspective(600px) rotateY(-18deg) rotateX(8deg) scale(.86);opacity:0}
.scene.on .logo3d{animation:reveal 1.6s cubic-bezier(.16,1,.3,1) forwards .4s}
@keyframes reveal{to{opacity:1;transform:perspective(600px) rotateY(0) rotateX(0) scale(1)}}
.devices{display:flex;align-items:flex-end;justify-content:center;gap:3vw;width:100%;max-width:1400px}
.laptop,.phone{border:1px solid rgba(212,175,55,.28);border-radius:18px;overflow:hidden;background:#0A0E1A;box-shadow:0 40px 80px rgba(0,0,0,.45)}
.laptop{width:min(58vw,920px);aspect-ratio:16/10}
.phone{width:min(18vw,280px);aspect-ratio:390/844;border-radius:28px}
.laptop img,.phone img,.shot{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.ken{transform:scale(1.08);animation:ken 8s ease-out forwards}
@keyframes ken{to{transform:scale(1)}}
.hero-zoom{width:min(90vw,1100px);border-radius:22px;overflow:hidden;border:1px solid rgba(212,175,55,.22);box-shadow:0 40px 90px rgba(0,0,0,.5)}
.hero-zoom img{width:100%;height:auto;display:block;transform:scale(1.25) translateY(8%);animation:push 4s ease-out forwards}
@keyframes push{to{transform:scale(1.05) translateY(0)}}
.kin{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
.kin b{font-family:"Playfair Display",serif;font-size:clamp(28px,4vw,56px);opacity:0;transform:translateY(24px);color:var(--gold2)}
.scene.on .kin b{animation:up .6s cubic-bezier(.16,1,.3,1) forwards}
.scene.on .kin b:nth-child(2){animation-delay:.45s}
.scene.on .kin b:nth-child(3){animation-delay:.9s}
@keyframes up{to{opacity:1;transform:none}}
.split{display:flex;gap:24px;align-items:stretch;justify-content:center;width:100%;max-width:1200px}
.split .card{flex:1;border-radius:20px;overflow:hidden;border:1px solid rgba(212,175,55,.22);max-width:520px;height:min(58vh,560px)}
.split .card img{width:100%;height:100%;object-fit:cover;object-position:top}
.navhint{position:absolute;bottom:18vh;left:50%;transform:translateX(-50%);display:flex;gap:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold2)}
.constellation{position:relative;width:min(92vw,1200px);height:min(62vh,620px)}
.node{position:absolute;width:min(28vw,340px);border-radius:16px;overflow:hidden;border:1px solid rgba(212,175,55,.25);box-shadow:0 20px 50px rgba(0,0,0,.4)}
.node img{width:100%;height:180px;object-fit:cover;object-position:top;display:block}
.n1{left:4%;top:8%}.n2{right:6%;top:0}.n3{left:32%;bottom:4%;width:min(34vw,420px)}
.endlogo{width:min(22vw,180px);margin-bottom:18px;filter:drop-shadow(0 20px 40px rgba(212,175,55,.4))}
.sweep{position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,rgba(243,213,138,.18),transparent 60%);transform:translateX(-120%);animation:sweep 1.8s ease .4s forwards;pointer-events:none;z-index:4}
@keyframes sweep{to{transform:translateX(120%)}}
.bar{position:absolute;bottom:0;left:0;height:2px;width:0;background:linear-gradient(90deg,#8A6A1A,var(--gold2));z-index:9}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="fx"></canvas>
  <div class="bar" id="bar"></div>
  <div class="caption" id="cap"></div>

  <section class="scene on" data-i="0">
    <img class="logo3d" src="logo.svg" alt="">
  </section>
  <section class="scene" data-i="1">
    <div class="devices">
      <div class="laptop ken"><img src="motion-stills/accueil-desktop.jpg" alt=""></div>
      <div class="phone ken"><img src="motion-stills/accueil-mobile.jpg" alt=""></div>
    </div>
  </section>
  <section class="scene" data-i="2">
    <div class="hero-zoom"><img src="motion-stills/accueil-desktop.jpg" alt=""></div>
  </section>
  <section class="scene" data-i="3">
    <div class="kin"><b>1 compte</b><b>Près de vous</b><b>Vérifié</b></div>
  </section>
  <section class="scene" data-i="4">
    <div class="split">
      <div class="card"><img src="motion-stills/accueil-cartes.jpg" alt=""></div>
      <div class="card"><img src="motion-stills/pro-connecte-missions.jpg" alt=""></div>
    </div>
    <div class="navhint">Missions · Alertes · Messages</div>
  </section>
  <section class="scene" data-i="5">
    <div class="constellation">
      <div class="node n1"><img src="motion-stills/pro-connecte-accueil.jpg" alt=""></div>
      <div class="node n2"><img src="motion-stills/etab-connecte-dashboard.jpg" alt=""></div>
      <div class="node n3"><img src="motion-stills/bo-connecte.jpg" alt=""></div>
    </div>
  </section>
  <section class="scene" data-i="6">
    <div>
      <img class="endlogo" src="logo.svg" alt="">
      <div class="sweep"></div>
    </div>
  </section>
</div>
<script>
(function(){
  const cues=[
    [0,'Découvrez URGAD.fr'],
    [5,'Le soin au bon endroit, au bon moment.'],
    [12,'Mise en relation soignants ↔ établissements'],
    [16,'1 compte  ·  Près de vous  ·  Vérifié'],
    [20,'Je suis professionnel  /  Je gère un établissement'],
    [25,'EHPAD, cliniques, maisons de retraite'],
    [30,'Documents vérifiés, réponses dans la journée'],
    [35,'URGAD.fr']
  ];
  const scenes=[...document.querySelectorAll('.scene')];
  const cap=document.getElementById('cap');
  const bar=document.getElementById('bar');
  const D=40000;
  const sceneAt=t=>{
    if(t<5000)return 0; if(t<12000)return 1; if(t<16000)return 2; if(t<20000)return 3;
    if(t<25000)return 4; if(t<35000)return 5; return 6;
  };
  let start=performance.now();
  function tick(now){
    const t=Math.min(now-start, D);
    bar.style.width=(t/D*100)+'%';
    const i=sceneAt(t);
    scenes.forEach((s,n)=>s.classList.toggle('on', n===i));
    let text='';
    for(const [at,tx] of cues){ if(t>=at*1000) text=tx; }
    cap.innerHTML=text+(t>=35000?'<small>Le soin, au bon endroit</small>':'');
    if(t<D) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  const c=document.getElementById('fx'), ctx=c.getContext('2d');
  function resize(){c.width=innerWidth;c.height=innerHeight}
  resize(); addEventListener('resize',resize);
  const N=90, pts=Array.from({length:N},()=>({
    x:Math.random(), y:Math.random(),
    vx:(Math.random()-.5)*.0004, vy:(Math.random()-.5)*.0004
  }));
  (function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    const cx=.5, cy=.42;
    pts.forEach(p=>{
      p.x+=(cx-p.x)*0.004+p.vx; p.y+=(cy-p.y)*0.004+p.vy;
      const x=p.x*c.width, y=p.y*c.height;
      ctx.fillStyle='rgba(212,175,55,.55)';
      ctx.beginPath(); ctx.arc(x,y,1.3,0,6.28); ctx.fill();
    });
    for(let i=0;i<N;i++) for(let j=i+1;j<N;j++){
      const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y, d=dx*dx+dy*dy;
      if(d<.012){
        ctx.strokeStyle='rgba(212,175,55,'+(0.12*(1-d/.012))+')';
        ctx.beginPath();
        ctx.moveTo(pts[i].x*c.width, pts[i].y*c.height);
        ctx.lineTo(pts[j].x*c.width, pts[j].y*c.height);
        ctx.stroke();
      }
    }
    requestAnimationFrame(draw);
  })();
})();
</script>
</body>
</html>
